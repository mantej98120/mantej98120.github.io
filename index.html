<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #faf8ef; }
    #grid { display: grid; grid-template-columns: repeat(4, 80px); grid-gap: 10px; background: #bbada0; padding: 10px; border-radius: 6px; }
    .cell { width: 80px; height: 80px; background: rgba(238, 228, 218, 0.35); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #776e65; }
  </style>
</head>
<body>
  <h1>2048 (WASD)</h1>
  <div id="grid"></div>
  <script>
    const gridEl = document.getElementById('grid');
    let board = [
      [0,0,0,0],
      [0,2,0,0],
      [0,0,0,0],
      [0,0,0,2]
    ];

    function draw() {
      gridEl.innerHTML = '';
      board.flat().forEach(val => {
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.background = val ? '#eee4da' : '';
        div.textContent = val === 0 ? '' : val;
        gridEl.appendChild(div);
      });
    }

    window.addEventListener('keydown', e => {
      switch(e.key.toLowerCase()) {
        case 'w': console.log('Up'); break;
        case 'a': console.log('Left'); break;
        case 's': console.log('Down'); break;
        case 'd': console.log('Right'); break;
      }
      draw();
    });

    draw();
  </script>
</body>
</html>
