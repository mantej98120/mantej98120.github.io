<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Click Counter</title>
    <style>
        /* Reset and Full Screen Centering */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Smooth, modern dark gradient background */
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            padding: 1rem;
        }

        /* Animated Background Gradient Movement */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Update Badge Styles at the top */
        .status-badge {
            position: absolute;
            top: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.02em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #eab308; /* Default yellow pending status */
            box-shadow: 0 0 8px #eab308;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        /* Centered Layout Wrapper */
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3.5rem;
        }

        /* Giant Clicker Button */
        .giant-click-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4), 
                        0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s, box-shadow 0.2s, background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .giant-click-btn:hover {
            background: linear-gradient(135deg, #34d399, #10b981);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.6), 
                        0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .giant-click-btn:active {
            transform: scale(0.92) translateY(2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
        }

        /* Running Tally Count at Bottom */
        .global-tracker {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        #clicks-display {
            color: #38bdf8; /* Vibrant cyan for the number */
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <!-- Top Status Indicator showing proof of update -->
    <div class="status-badge">
        <div class="status-dot" id="network-dot"></div>
        <span>v1.2 Latest Update: 29 Oct 2026</span>
    </div>

    <div class="counter-container">
        <!-- Big Button in the Middle -->
        <button class="giant-click-btn" id="click-trigger">CLICK! 🖱️</button>

        <!-- Count Display Tally at the Bottom -->
        <div class="global-tracker">
            <span id="clicks-display">0</span> #clicks
        </div>
    </div>

    <!-- Fail-safe Hybrid JavaScript Layer -->
    <script>
        const username = "mantej98120";
        const countUrl = `https://counterapi.dev{username}/clicks/up`;
        const viewUrl = `https://counterapi.dev{username}/clicks`;
        
        const clickButton = document.getElementById('click-trigger');
        const clicksDisplay = document.getElementById('clicks-display');
        const networkDot = document.getElementById('network-dot');

        let localBackupCount = parseInt(localStorage.getItem('mantej_clicks')) || 0;
        let basicMode = false;

        function setStatus(mode) {
            if (mode === 'live') {
                networkDot.style.backgroundColor = '#10b981'; // Green
                networkDot.style.boxShadow = '0 0 8px #10b981';
            } else {
                networkDot.style.backgroundColor = '#eab308'; // Yellow
                networkDot.style.boxShadow = '0 0 8px #eab308';
            }
        }

        async function loadClicks() {
            try {
                const response = await fetch(viewUrl);
                if (!response.ok) throw new Error("Server issue");
                const data = await response.json();
                clicksDisplay.textContent = data.count || 0;
                setStatus('live');
            } catch (error) {
                console.log("Using Local Storage Mode.");
                basicMode = true;
                clicksDisplay.textContent = localBackupCount;
                setStatus('local');
            }
        }

        clickButton.addEventListener('click', async () => {
            if (basicMode) {
                localBackupCount++;
                localStorage.setItem('mantej_clicks', localBackupCount);
                clicksDisplay.textContent = localBackupCount;
            } else {
                clicksDisplay.textContent = "...";
                try {
                    const response = await fetch(countUrl);
                    if (!response.ok) throw new Error("Update failed");
                    const data = await response.json();
                    clicksDisplay.textContent = data.count;
                    setStatus('live');
                } catch (error) {
                    basicMode = true;
                    localBackupCount++;
                    localStorage.setItem('mantej_clicks', localBackupCount);
                    clicksDisplay.textContent = localBackupCount;
                    setStatus('local');
                }
            }
        });

        loadClicks();
    </script>
</body>
</html>
