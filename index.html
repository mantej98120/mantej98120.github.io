<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turball 3D - Rocket Car Soccer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #0b101b; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
    }
    .top-bar { display: flex; justify-content: center; align-items: center; gap: 24px; }
    .score-box {
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 28px; border-radius: 12px; display: flex; align-items: center; gap: 20px;
      backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .team-blue { color: #38bdf8; font-weight: 800; font-size: 28px; }
    .team-orange { color: #fb923c; font-weight: 800; font-size: 28px; }
    .divider { color: #64748b; font-weight: 700; font-size: 20px; }
    .cam-badge {
      position: fixed; top: 24px; left: 24px;
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
      color: #38bdf8;
    }
    .controls-hint {
      position: fixed; top: 24px; right: 24px;
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px; border-radius: 10px; font-size: 12px; line-height: 1.6; color: #cbd5e1;
    }
    .controls-hint b { color: #fff; }
    .bottom-bar { display: flex; justify-content: flex-end; align-items: flex-end; }
    .boost-meter {
      width: 150px; height: 150px; border-radius: 50%;
      background: radial-gradient(circle, rgba(15,23,42,0.9) 55%, rgba(30,41,59,0.95) 100%);
      border: 4px solid #f59e0b; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
    }
    .boost-val { font-size: 38px; font-weight: 900; color: #fbbf24; line-height: 1; }
    .boost-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #94a3b8; margin-top: 4px; }
    #banner {
      position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
      font-size: 64px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
      text-shadow: 0 10px 30px rgba(0,0,0,0.7); opacity: 0; transition: all 0.25s ease;
      pointer-events: none;
    }
    #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>
  <div id="hud">
    <div class="cam-badge" id="camStatus">BALL CAM: ON (F)</div>
    <div class="top-bar">
      <div class="score-box">
        <span class="team-blue" id="blueScore">0</span>
        <span class="divider">VS</span>
        <span class="team-orange" id="orangeScore">0</span>
      </div>
    </div>
    <div class="controls-hint">
      <b>W/S or ↑/↓</b> Drive / Air Pitch<br>
      <b>A/D or ←/→</b> Steer / Air Yaw<br>
      <b>SPACE</b> Jump & Double-Jump Flip<br>
      <b>SHIFT</b> Rocket Boost<br>
      <b>E / C</b> Powerslide Drift<br>
      <b>F / TAB</b> Toggle Ball Cam<br>
      <b>R</b> Reset Kickoff
    </div>
    <div id="banner">GOAL!</div>
    <div class="bottom-bar">
      <div class="boost-meter" id="boostRing">
        <div class="boost-val" id="boostVal">100</div>
        <div class="boost-label">BOOST</div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // --- SCENE & RENDERER ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);
    scene.fog = new THREE.FogExp2(0x0b1120, 0.0045);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 1.1);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
    dirLight.position.set(40, 85, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 10;
    dirLight.shadow.camera.far = 220;
    const d = 95;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // --- ARENA DIMENSIONS ---
    const ARENA_W = 84;   // X: -42 to +42
    const ARENA_L = 136;  // Z: -68 to +68
    const ARENA_H = 34;   // Ceiling height
    const GOAL_W = 24;
    const GOAL_H = 10;
    const GOAL_D = 12;

    // Pitch Floor
    const floorGeo = new THREE.PlaneGeometry(ARENA_W, ARENA_L);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.75, metalness: 0.05 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Pitch Markings
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 });
    const midLine = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_W, 0.6), lineMat);
    midLine.rotation.x = -Math.PI / 2;
    midLine.position.y = 0.02;
    scene.add(midLine);

    const centerCircle = new THREE.Mesh(new THREE.RingGeometry(11.5, 12.1, 48), lineMat);
    centerCircle.rotation.x = -Math.PI / 2;
    centerCircle.position.y = 0.02;
    scene.add(centerCircle);

    // Glass Arena Walls
    const wallMat = new THREE.MeshPhysicalMaterial({
      color: 0x38bdf8, transparent: true, opacity: 0.14, roughness: 0.1, side: THREE.DoubleSide
    });
    const borderMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.6, roughness: 0.3 });

    function addWall(w, h, x, y, z, ry = 0) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      mesh.position.set(x, y, z);
      mesh.rotation.y = ry;
      scene.add(mesh);

      const trim = new THREE.Mesh(new THREE.BoxGeometry(w, 0.8, 0.8), borderMat);
      trim.position.set(x, 0.4, z);
      trim.rotation.y = ry;
      scene.add(trim);
    }

    // Side walls
    addWall(ARENA_L, ARENA_H, -ARENA_W / 2, ARENA_H / 2, 0, Math.PI / 2);
    addWall(ARENA_L, ARENA_H, ARENA_W / 2, ARENA_H / 2, 0, -Math.PI / 2);

    // End walls around goal openings
    const sideBackW = (ARENA_W - GOAL_W) / 2;
    [-ARENA_L / 2, ARENA_L / 2].forEach(zPos => {
      addWall(sideBackW, ARENA_H, -GOAL_W / 2 - sideBackW / 2, ARENA_H / 2, zPos, 0);
      addWall(sideBackW, ARENA_H, GOAL_W / 2 + sideBackW / 2, ARENA_H / 2, zPos, 0);
      addWall(GOAL_W, ARENA_H - GOAL_H, 0, GOAL_H + (ARENA_H - GOAL_H) / 2, zPos, 0);
    });

    // Goals (Blue at +Z, Orange at -Z)
    function createGoal(zSign, colorHex) {
      const group = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.35 });
      const netMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.18, side: THREE.DoubleSide });

      const baseZ = zSign * (ARENA_L / 2);
      const backZ = zSign * (ARENA_L / 2 + GOAL_D);

      // Frame posts
      const leftPost = new THREE.Mesh(new THREE.BoxGeometry(0.8, GOAL_H, 0.8), postMat);
      leftPost.position.set(-GOAL_W / 2, GOAL_H / 2, baseZ);
      const rightPost = new THREE.Mesh(new THREE.BoxGeometry(0.8, GOAL_H, 0.8), postMat);
      rightPost.position.set(GOAL_W / 2, GOAL_H / 2, baseZ);
      const crossbar = new THREE.Mesh(new THREE.BoxGeometry(GOAL_W + 0.8, 0.8, 0.8), postMat);
      crossbar.position.set(0, GOAL_H, baseZ);
      group.add(leftPost, rightPost, crossbar);

      // Goal box netting
      const backNet = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, GOAL_H), netMat);
      backNet.position.set(0, GOAL_H / 2, backZ);
      const topNet = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, GOAL_D), netMat);
      topNet.rotation.x = Math.PI / 2;
      topNet.position.set(0, GOAL_H, (baseZ + backZ) / 2);
      group.add(backNet, topNet);

      scene.add(group);
    }
    createGoal(1, 0x38bdf8);   // Blue Goal (+Z)
    createGoal(-1, 0xfb923c);  // Orange Goal (-Z)

    // --- BOOST PADS ---
    const boostPads = [];
    const padPositions = [
      [-32, -46], [32, -46], [-32, 0], [32, 0], [-32, 46], [32, 46],
      [0, -34], [0, 34], [-18, -20], [18, -20], [-18, 20], [18, 20]
    ];
    const padGeo = new THREE.CylinderGeometry(1.6, 1.9, 0.25, 24);
    const orbGeo = new THREE.SphereGeometry(0.75, 16, 16);

    padPositions.forEach(([x, z], idx) => {
      const isBig = idx < 6;
      const base = new THREE.Mesh(padGeo, new THREE.MeshStandardMaterial({ color: 0x334155 }));
      base.position.set(x, 0.12, z);
      scene.add(base);

      const orb = new THREE.Mesh(
        isBig ? new THREE.SphereGeometry(1.05, 16, 16) : orbGeo,
        new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xf59e0b, emissiveIntensity: 0.9 })
      );
      orb.position.set(x, isBig ? 1.3 : 0.9, z);
      scene.add(orb);

      boostPads.push({ x, z, isBig, orb, cooldown: 0 });
    });

    // --- BALL ---
    const BALL_RADIUS = 3.2;
    const ballGroup = new THREE.Group();
    const ballMesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(BALL_RADIUS, 3),
