<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turball 3D - Rocket Car Soccer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #0b101b; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
    }
    .top-bar { display: flex; justify-content: center; align-items: center; gap: 24px; }
    .score-box {
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 28px; border-radius: 12px; display: flex; align-items: center; gap: 20px;
      backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .team-blue { color: #38bdf8; font-weight: 800; font-size: 28px; }
    .team-orange { color: #fb923c; font-weight: 800; font-size: 28px; }
    .divider { color: #64748b; font-weight: 700; font-size: 20px; }
    .cam-badge {
      position: fixed; top: 24px; left: 24px;
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
      color: #38bdf8;
    }
    .controls-hint {
      position: fixed; top: 24px; right: 24px;
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px; border-radius: 10px; font-size: 12px; line-height: 1.6; color: #cbd5e1;
    }
    .controls-hint b { color: #fff; }
    .bottom-bar { display: flex; justify-content: flex-end; align-items: flex-end; }
    .boost-meter {
      width: 150px; height: 150px; border-radius: 50%;
      background: radial-gradient(circle, rgba(15,23,42,0.9) 55%, rgba(30,41,59,0.95) 100%);
      border: 4px solid #f59e0b; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
    }
    .boost-val { font-size: 38px; font-weight: 900; color: #fbbf24; line-height: 1; }
    .boost-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #94a3b8; margin-top: 4px; }
    #banner {
      position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
      font-size: 64px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
      text-shadow: 0 10px 30px rgba(0,0,0,0.7); opacity: 0; transition: all 0.25s ease;
      pointer-events: none;
    }
    #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>
  <div id="hud">
    <div class="cam-badge" id="camStatus">BALL CAM: ON (F)</div>
    <div class="top-bar">
      <div class="score-box">
        <span class="team-blue" id="blueScore">0</span>
        <span class="divider">VS</span>
        <span class="team-orange" id="orangeScore">0</span>
      </div>
    </div>
    <div class="controls-hint">
      <b>W/S or ↑/↓</b> Drive / Air Pitch<br>
      <b>A/D or ←/→</b> Steer / Air Yaw<br>
      <b>SPACE</b> Jump & Double-Jump Flip<br>
      <b>SHIFT</b> Rocket Boost<br>
      <b>E / C</b> Powerslide Drift<br>
      <b>F / TAB</b> Toggle Ball Cam<br>
      <b>R</b> Reset Kickoff
    </div>
    <div id="banner">GOAL!</div>
    <div class="bottom-bar">
      <div class="boost-meter" id="boostRing">
        <div class="boost-val" id="boostVal">100</div>
        <div class="boost-label">BOOST</div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // --- SCENE & RENDERER ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);
    scene.fog = new THREE.FogExp2(0x0b1120, 0.0045);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 1.1);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
    dirLight.position.set(40, 85, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 10;
    dirLight.shadow.camera.far = 220;
    const d = 95;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // --- ARENA DIMENSIONS ---
    const ARENA_W = 84;   // X: -42 to +42
    const ARENA_L = 136;  // Z: -68 to +68
    const ARENA_H = 34;   // Ceiling height
    const GOAL_W = 24;
    const GOAL_H = 10;
    const GOAL_D = 12;

    // Pitch Floor
    const floorGeo = new THREE.PlaneGeometry(ARENA_W, ARENA_L);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.75, metalness: 0.05 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Pitch Markings
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 });
    const midLine = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_W, 0.6), lineMat);
    midLine.rotation.x = -Math.PI / 2;
    midLine.position.y = 0.02;
    scene.add(midLine);

    const centerCircle = new THREE.Mesh(new THREE.RingGeometry(11.5, 12.1, 48), lineMat);
    centerCircle.rotation.x = -Math.PI / 2;
    centerCircle.position.y = 0.02;
    scene.add(centerCircle);

    // Glass Arena Walls
    const wallMat = new THREE.MeshPhysicalMaterial({
      color: 0x38bdf8, transparent: true, opacity: 0.14, roughness: 0.1, side: THREE.DoubleSide
    });
    const borderMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.6, roughness: 0.3 });

    function addWall(w, h, x, y, z, ry = 0) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      mesh.position.set(x, y, z);
      mesh.rotation.y = ry;
      scene.add(mesh);

      const trim = new THREE.Mesh(new THREE.BoxGeometry(w, 0.8, 0.8), borderMat);
      trim.position.set(x, 0.4, z);
      trim.rotation.y = ry;
      scene.add(trim);
    }

    // Side walls
    addWall(ARENA_L, ARENA_H, -ARENA_W / 2, ARENA_H / 2, 0, Math.PI / 2);
    addWall(ARENA_L, ARENA_H, ARENA_W / 2, ARENA_H / 2, 0, -Math.PI / 2);

    // End walls around goal openings
    const sideBackW = (ARENA_W - GOAL_W) / 2;
    [-ARENA_L / 2, ARENA_L / 2].forEach(zPos => {
      addWall(sideBackW, ARENA_H, -GOAL_W / 2 - sideBackW / 2, ARENA_H / 2, zPos, 0);
      addWall(sideBackW, ARENA_H, GOAL_W / 2 + sideBackW / 2, ARENA_H / 2, zPos, 0);
      addWall(GOAL_W, ARENA_H - GOAL_H, 0, GOAL_H + (ARENA_H - GOAL_H) / 2, zPos, 0);
    });

    // Goals (Blue at +Z, Orange at -Z)
    function createGoal(zSign, colorHex) {
      const group = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.35 });
      const netMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.18, side: THREE.DoubleSide });

      const baseZ = zSign * (ARENA_L / 2);
      const backZ = zSign * (ARENA_L / 2 + GOAL_D);

      // Frame posts
      const leftPost = new THREE.Mesh(new THREE.BoxGeometry(0.8, GOAL_H, 0.8), postMat);
      leftPost.position.set(-GOAL_W / 2, GOAL_H / 2, baseZ);
      const rightPost = new THREE.Mesh(new THREE.BoxGeometry(0.8, GOAL_H, 0.8), postMat);
      rightPost.position.set(GOAL_W / 2, GOAL_H / 2, baseZ);
      const crossbar = new THREE.Mesh(new THREE.BoxGeometry(GOAL_W + 0.8, 0.8, 0.8), postMat);
      crossbar.position.set(0, GOAL_H, baseZ);
      group.add(leftPost, rightPost, crossbar);

      // Goal box netting
      const backNet = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, GOAL_H), netMat);
      backNet.position.set(0, GOAL_H / 2, backZ);
      const topNet = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, GOAL_D), netMat);
      topNet.rotation.x = Math.PI / 2;
      topNet.position.set(0, GOAL_H, (baseZ + backZ) / 2);
      group.add(backNet, topNet);

      scene.add(group);
    }
    createGoal(1, 0x38bdf8);   // Blue Goal (+Z)
    createGoal(-1, 0xfb923c);  // Orange Goal (-Z)

    // --- BOOST PADS ---
    const boostPads = [];
    const padPositions = [
      [-32, -46], [32, -46], [-32, 0], [32, 0], [-32, 46], [32, 46],
      [0, -34], [0, 34], [-18, -20], [18, -20], [-18, 20], [18, 20]
    ];
    const padGeo = new THREE.CylinderGeometry(1.6, 1.9, 0.25, 24);
    const orbGeo = new THREE.SphereGeometry(0.75, 16, 16);

    padPositions.forEach(([x, z], idx) => {
      const isBig = idx < 6;
      const base = new THREE.Mesh(padGeo, new THREE.MeshStandardMaterial({ color: 0x334155 }));
      base.position.set(x, 0.12, z);
      scene.add(base);

      const orb = new THREE.Mesh(
        isBig ? new THREE.SphereGeometry(1.05, 16, 16) : orbGeo,
        new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xf59e0b, emissiveIntensity: 0.9 })
      );
      orb.position.set(x, isBig ? 1.3 : 0.9, z);
      scene.add(orb);

      boostPads.push({ x, z, isBig, orb, cooldown: 0 });
    });

    // --- BALL ---
    const BALL_RADIUS = 3.2;
    const ballGroup = new THREE.Group();
    new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25, metalness: 0.35 })
);
ballMesh.castShadow = true;
const ballWire = new THREE.Mesh(
new THREE.IcosahedronGeometry(BALL_RADIUS + 0.04, 2),
new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.35 })
);
ballGroup.add(ballMesh, ballWire);
scene.add(ballGroup);
// Ball ground indicator ring
const groundRing = new THREE.Mesh(
new THREE.RingGeometry(BALL_RADIUS * 0.85, BALL_RADIUS * 1.05, 32),
new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
);
groundRing.rotation.x = -Math.PI / 2;
groundRing.position.y = 0.05;
scene.add(groundRing);
const ball = {
pos: new THREE.Vector3(0, BALL_RADIUS, 0),
vel: new THREE.Vector3(0, 0, 0),
angVel: new THREE.Vector3(0, 0, 0)
};
// --- PLAYER CAR (Clear Front & Rear Orientation) ---
// Local -Z is FORWARD, +Z is REAR
const carGroup = new THREE.Group();
// Main Chassis
const chassis = new THREE.Mesh(
new THREE.BoxGeometry(2.6, 0.95, 4.6),
new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3, metalness: 0.4 })
);
chassis.position.y = 0.85;
chassis.castShadow = true;
carGroup.add(chassis);
// Sloped Hood (Front is -Z)
const hood = new THREE.Mesh(
new THREE.BoxGeometry(2.3, 0.45, 1.8),
new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.25, metalness: 0.5 })
);
hood.position.set(0, 1.25, -1.1);
hood.rotation.x = 0.14;
carGroup.add(hood);
// Cabin / Windshield
const cabin = new THREE.Mesh(
new THREE.BoxGeometry(2.05, 0.72, 2.0),
new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.15, metalness: 0.8 })
);
cabin.position.set(0, 1.55, 0.25);
carGroup.add(cabin);
// Headlights (Front -Z)
const headlightMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
[-0.85, 0.85].forEach(x => {
const hl = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.22, 0.15), headlightMat);
hl.position.set(x, 0.95, -2.32);
carGroup.add(hl);
});
// Rear Spoiler (+Z)
const spoilerWing = new THREE.Mesh(
new THREE.BoxGeometry(2.7, 0.16, 0.65),
new THREE.MeshStandardMaterial({ color: 0x0f172a })
);
spoilerWing.position.set(0, 1.85, 2.05);
carGroup.add(spoilerWing);
[-0.95, 0.95].forEach(x => {
const strut = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.55, 0.35), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
strut.position.set(x, 1.55, 2.05);
carGroup.add(strut);
});
// Glowing Boost Exhaust & Flame (+Z)
const exhaust = new THREE.Mesh(
new THREE.CylinderGeometry(0.32, 0.38, 0.4, 16),
new THREE.MeshStandardMaterial({ color: 0x334155 })
);
exhaust.rotation.x = Math.PI / 2;
exhaust.position.set(0, 0.85, 2.35);
carGroup.add(exhaust);
const flame = new THREE.Mesh(
new THREE.ConeGeometry(0.38, 2.2, 16),
new THREE.MeshBasicMaterial({ color: 0xf97316 })
);
flame.rotation.x = Math.PI / 2;
flame.position.set(0, 0.85, 3.5);
flame.visible = false;
carGroup.add(flame);
// Wheels
const wheelGeo = new THREE.CylinderGeometry(0.58, 0.58, 0.45, 20);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
[[-1.4, -1.45], [1.4, -1.45], [-1.4, 1.45], [1.4, 1.45]].forEach(([wx, wz]) => {
const w = new THREE.Mesh(wheelGeo, wheelMat);
w.rotation.z = Math.PI / 2;
w.position.set(wx, 0.58, wz);
carGroup.add(w);
});
scene.add(carGroup);
// --- CAR PHYSICS STATE ---
const car = {
pos: new THREE.Vector3(0, 0, 38),
vel: new THREE.Vector3(0, 0, 0),
quat: new THREE.Quaternion(),
angVel: new THREE.Vector3(0, 0, 0),
grounded: true,
canDoubleJump: false,
jumpTimer: 0,
flipTimer: 0,
flipTorque: new THREE.Vector3(),
boost: 100
};
let blueScore = 0;
let orangeScore = 0;
let ballCam = true;
let goalFreeze = 0;
function resetKickoff() {
// Spawn player on Blue side (+Z) facing directly forward (-Z) toward center ball & Orange goal
car.pos.set(0, 0, 38);
car.vel.set(0, 0, 0);
car.quat.identity(); // -Z is forward
car.angVel.set(0, 0, 0);
car.grounded = true;
car.canDoubleJump = false;
car.flipTimer = 0;
car.boost = 100;
ball.pos.set(0, BALL_RADIUS, 0);
ball.vel.set(0, 0, 0);
ball.angVel.set(0, 0, 0);
// Snap camera immediately behind car's rear bumper looking toward ball & opponent goal
camera.position.set(0, 6.2, 51);
camera.lookAt(0, 2.5, 0);
}
resetKickoff();
// --- INPUT HANDLING ---
const keys = {};
window.addEventListener('keydown', (e) => {
const code = e.code;
if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(code)) {
e.preventDefault();
}
if (!keys[code]) {
if (code === 'Space') handleJump();
if (code === 'KeyF' || code === 'Tab') {
ballCam = !ballCam;
document.getElementById('camStatus').textContent = BALL CAM: ${ballCam ? 'ON' : 'OFF'} (F);
}
if (code === 'KeyR') resetKickoff();
}
keys[code] = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
function handleJump() {
if (goalFreeze > 0) return;
const up = new THREE.Vector3(0, 1, 0).applyQuaternion(car.quat);
if (car.grounded) {
car.vel.addScaledVector(up, 18.5);
car.grounded = false;
car.canDoubleJump = true;
car.jumpTimer = 1.5;
} else if (car.canDoubleJump && car.jumpTimer > 0) {
car.canDoubleJump = false;
const forwardInput = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0);
const sideInput = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(car.quat);
const right = new THREE.Vector3(1, 0, 0).applyQuaternion(car.quat);
fwd.y = 0; fwd.normalize();
right.y = 0; right.normalize();
if (forwardInput !== 0 || sideInput !== 0) {
// Directional Dodge Flip
const dodgeDir = new THREE.Vector3()
.addScaledVector(fwd, forwardInput)
.addScaledVector(right, sideInput)
.normalize();
car.vel.addScaledVector(dodgeDir, 24);
car.vel.y = Math.max(car.vel.y * 0.4, 3.5);
car.flipTimer = 0.42;
car.flipTorque.set(-forwardInput * 14, 0, -sideInput * 14);
} else {
// Double Jump Pop
car.vel.y += 17;
}
}
}
// --- MAIN SIMULATION LOOP ---
const clock = new THREE.Clock();
const camPosTarget = new THREE.Vector3();
const camLookTarget = new THREE.Vector3();
function showBanner(text, color) {
const b = document.getElementById('banner');
b.textContent = text;
b.style.color = color;
b.classList.add('show');
setTimeout(() => b.classList.remove('show'), 2000);
}
function updatePhysics(dt) {
if (goalFreeze > 0) {
goalFreeze -= dt;
if (goalFreeze <= 0) resetKickoff();
return;
}
const throttle = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0);
const steer = (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0) - (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0);
const isBoosting = (keys['ShiftLeft'] || keys['ShiftRight']) && car.boost > 0.5;
const isDrifting = keys['KeyE'] || keys['KeyC'];
const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(car.quat);
const right = new THREE.Vector3(1, 0, 0).applyQuaternion(car.quat);
const up = new THREE.Vector3(0, 1, 0).applyQuaternion(car.quat);
if (car.grounded) {
// Ground acceleration & braking
const accel = throttle > 0 ? 54 : 42;
car.vel.addScaledVector(fwd, throttle * accel * dt);
// Lateral tire grip vs powerslide drift
const lateralSpeed = car.vel.dot(right);
const grip = isDrifting ? 2.2 : 11.5;
car.vel.addScaledVector(right, -lateralSpeed * Math.min(1, grip * dt));
// Steering
const forwardSpeed = car.vel.dot(fwd);
const speedFactor = Math.min(1, Math.abs(forwardSpeed) / 8);
const reverseSign = forwardSpeed >= -0.5 ? 1 : -1;
const turnRate = isDrifting ? 3.5 : 2.55;
const yawDelta = new THREE.Quaternion().setFromAxisAngle(
new THREE.Vector3(0, 1, 0),
steer * turnRate * speedFactor * reverseSign * dt
);
car.quat.premultiply(yawDelta);
// Rolling resistance
car.vel.multiplyScalar(Math.pow(0.45, dt));
} else {
// Mid-air gravity & orientation control
car.vel.y -= 36 * dt;
car.jumpTimer = Math.max(0, car.jumpTimer - dt);
if (car.flipTimer > 0) {
car.flipTimer -= dt;
const flipStep = new THREE.Quaternion().setFromEuler(
new THREE.Euler(car.flipTorque.x * dt, 0, car.flipTorque.z * dt, 'YXZ')
);
car.quat.multiply(flipStep);
} else {
const pitchRate = -throttle * 3.2 * dt;
const yawRate = steer * 3.0 * dt;
const airRot = new THREE.Quaternion().setFromEuler(new THREE.Euler(pitchRate, yawRate, 0, 'YXZ'));
car.quat.multiply(airRot);
}
}
// Rocket Boost
if (isBoosting) {
car.boost = Math.max(0, car.boost - 34 * dt);
car.vel.addScaledVector(fwd, 64 * dt);
flame.visible = true;
flame.scale.setScalar(0.85 + Math.random() * 0.35);
} else {
flame.visible = false;
}
// Cap max car speed
const maxSpeed = isBoosting ? 58 : 42;
if (car.vel.length() > maxSpeed) {
car.vel.setLength(maxSpeed);
}
car.pos.addScaledVector(car.vel, dt);
// Ground landing & auto-leveling
if (car.pos.y <= 0) {
car.pos.y = 0;
if (car.vel.y < 0) car.vel.y = 0;
car.grounded = true;
car.flipTimer = 0;
const euler = new THREE.Euler().setFromQuaternion(car.quat, 'YXZ');
euler.x = 0;
euler.z = 0;
car.quat.setFromEuler(euler);
}
// Car Arena Bounds
const halfW = ARENA_W / 2 - 2.2;
const halfL = ARENA_L / 2 - 2.4;
if (car.pos.x < -halfW) { car.pos.x = -halfW; car.vel.x *= -0.4; }
if (car.pos.x > halfW) { car.pos.x = halfW; car.vel.x *= -0.4; }
if (car.pos.z < -halfL) { car.pos.z = -halfL; car.vel.z *= -0.4; }
if (car.pos.z > halfL) { car.pos.z = halfL; car.vel.z *= -0.4; }
if (car.pos.y > ARENA_H - 2) { car.pos.y = ARENA_H - 2; car.vel.y = Math.min(0, car.vel.y); }
// Boost Pad Pickups
boostPads.forEach(pad => {
if (pad.cooldown > 0) {
pad.cooldown -= dt;
if (pad.cooldown <= 0) pad.orb.visible = true;
} else {
pad.orb.rotation.y += 2.5 * dt;
const dx = car.pos.x - pad.x;
const dz = car.pos.z - pad.z;
if (dx * dx + dz * dz < 9.5 && car.pos.y < 3.5 && car.boost < 100) {
car.boost = Math.min(100, car.boost + (pad.isBig ? 100 : 20));
pad.orb.visible = false;
pad.cooldown = pad.isBig ? 10 : 4;
}
}
});
// --- BALL PHYSICS ---
ball.vel.y -= 28 * dt;
ball.vel.multiplyScalar(Math.pow(0.94, dt)); // Air drag
ball.pos.addScaledVector(ball.vel, dt);
// Floor & Ceiling bounce
if (ball.pos.y < BALL_RADIUS) {
ball.pos.y = BALL_RADIUS;
if (ball.vel.y < -1.5) ball.vel.y *= -0.72;
else ball.vel.y = 0;
ball.vel.x *= Math.pow(0.82, dt);
