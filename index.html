<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #faf8ef; }
    #grid { display: grid; grid-template-columns: repeat(4, 80px); grid-gap: 10px; background: #bbada0; padding: 10px; border-radius: 6px; }
    .cell { width: 80px; height: 80px; background: rgba(238, 228, 218, 0.35); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #776e65; }
  </style>
</head>
<body>
  <h1>2048 (WASD)</h1>
  <div id="grid"></div>
  <script>
    const gridEl = document.getElementById('grid');
    let board = [,
 ,
 ,
      [0,0,0,2]
    ];

    function draw() {
      gridEl.innerHTML = '';
      board.flat().forEach(val => {
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.background = val ? '#eee4da' : '';
        div.textContent = val === 0 ? '' : val;
        gridEl.appendChild(div);
      });
    }

    function slideRow(row) {
      let filtered = row.filter(val => val !== 0);
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          filtered[i + 1] = 0;
        }
      }
      filtered = filtered.filter(val => val !== 0);
      while (filtered.length < 4) {
        filtered.push(0);
      }
      return filtered;
    }

    function rotateLeft(matrix) {
      return matrix[0].map((_, colIndex) => matrix.map(row => row[colIndex])).reverse();
    }

    function rotateRight(matrix) {
      return matrix[0].map((_, colIndex) => matrix.map(row => row[colIndex]).reverse());
    }

    function spawnTile() {
      let emptyCells = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) emptyCells.push({r, c});
        }
      }
      if (emptyCells.length > 0) {
        let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        board[randomCell.r][randomCell.colIndex ?? randomCell.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    window.addEventListener('keydown', e => {
      let key = e.key.toLowerCase();
      if (!['w', 'a', 's', 'd'].includes(key)) return;

      let prevBoard = JSON.stringify(board);

      if (key === 'a') {
        board = board.map(row => slideRow(row));
      } else if (key === 'd') {
        board = board.map(row => slideRow(row.reverse()).reverse());
      } else if (key === 'w') {
        board = rotateLeft(board);
        board = board.map(row => slideRow(row));
        board = rotateRight(board);
      } else if (key === 's') {
        board = rotateRight(board);
        board = board.map(row => slideRow(row));
        board = rotateLeft(board);
      }

      if (prevBoard !== JSON.stringify(board)) {
        spawnTile();
      }
      
      draw();
    });

    draw();
  </script>
</body>
</html>
